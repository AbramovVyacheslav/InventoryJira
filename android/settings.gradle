pluginManagement {
    def flutterSdkPath = {
        def localPropertiesFile = new File(rootDir, 'local.properties')
        def properties = new Properties()
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def flutterSdkPath = properties.getProperty('flutter.sdk')
        if (flutterSdkPath == null) {
            flutterSdkPath = System.getenv('FLUTTER_ROOT')
        }
        assert flutterSdkPath != null,
            'flutter.sdk не задан ни в local.properties, ни в переменной окружения FLUTTER_ROOT'
        return flutterSdkPath
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false
}

include ":app"
