plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def flutterVersionCode = 1
def flutterVersionName = '1.0.0'

android {
    namespace "com.inventoryjira.app"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.inventoryjira.app"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // ПЕРЕД РЕЛИЗОМ: создайте собственный keystore и подпишите им APK
            // (см. README, раздел «Сборка APK»). Временно используется debug-ключ.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
